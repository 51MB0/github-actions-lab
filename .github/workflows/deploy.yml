name: Deploy to VPS

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Déploiement sur VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          port: 49222
          key: ${{ secrets.SSH_PRIVATE_KEY }}

          script: |
            script: |
                set -e
                echo "=== Début du déploiement ==="
                APP_DIR="/var/www/projet_colent/github-actions-lab"
                mkdir -p "$APP_DIR"
                cd "$APP_DIR"
                echo "Nettoyage de l'ancienne version..."
                rm -rf *
                echo "Téléchargement du code depuis GitHub..."
                git clone --depth 1 https://github.com/51MBO/github-actions-lab.git .
                echo "=== Déploiement terminé ==="
                echo "Contenu déployé :"
                ls -la